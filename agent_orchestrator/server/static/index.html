<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Orchestrator — Codex × Claude Code</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <span class="node a"></span>
        <span class="node b"></span>
      </span>
      <div class="brand-text">
        <span class="wordmark">agent<span class="slash">//</span>orchestrator</span>
        <span class="sub">Codex&nbsp;×&nbsp;Claude&nbsp;Code · live collaboration</span>
      </div>
    </div>
    <div id="conn" class="conn idle" role="status" aria-live="polite">
      <span class="conn-dot"></span>
      <span class="conn-label">idle</span>
    </div>
  </header>

  <main class="console">
    <!-- Compose rail -->
    <section class="panel rail" aria-label="Compose">
      <div class="panel-head">
        <span class="eyebrow">Compose</span>
      </div>

      <label class="field">
        <span class="field-label">Task</span>
        <textarea id="task" rows="5"
          placeholder="Describe the task for the agents to collaborate on…"></textarea>
      </label>

      <label class="field">
        <span class="field-label">Strategy</span>
        <div class="select-wrap">
          <select id="strategy"></select>
        </div>
        <span id="strategy-desc" class="hint"></span>
      </label>

      <div id="roles" class="roles"></div>

      <label class="field rounds">
        <span class="field-label">Rounds</span>
        <input id="rounds" type="number" min="1" max="8" value="2" />
      </label>

      <div class="actions">
        <button id="run" class="btn primary">
          <span class="btn-label">Run collaboration</span>
        </button>
        <button id="stop" class="btn ghost" disabled>Stop</button>
      </div>
      <div id="status" class="status" role="status" aria-live="polite"></div>
    </section>

    <!-- Live transcript -->
    <section class="panel feed" aria-label="Live transcript">
      <div class="panel-head feed-head">
        <span class="eyebrow">Live transcript</span>
        <div id="meta" class="meta"></div>
      </div>
      <div id="stream" class="stream">
        <div class="empty">
          <div class="empty-motif" aria-hidden="true">
            <span class="chip a">A</span>
            <span class="link-line"></span>
            <span class="chip b">B</span>
          </div>
          <h2 class="empty-title">Two agents, one task.</h2>
          <p class="empty-copy">
            Configure the collaboration on the left and press
            <em>Run</em>. Each agent's turn streams in here as it happens.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    Runs on the Python standard library — no installs, no telemetry.
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
