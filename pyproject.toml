[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-research-tool"
version = "0.4.0"
description = "Automated research tool with AI assistance"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Deep Research Tool Team"}
]
keywords = ["research", "ai", "llm", "automation", "web-scraping"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "duckduckgo-search>=6.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "python-docx>=1.1.0",
    "pypdf>=4.2.0",
    "reportlab>=4.2.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "Pillow>=10.3.0",
    "requests>=2.32.0",
    "jinja2>=3.1.0",
    "click>=8.1.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "janome>=0.5.0",
]

[project.optional-dependencies]
selenium = [
    "selenium>=4.20.0",
    "webdriver-manager>=4.0.0",
]
pdf = [
    "PyMuPDF>=1.24.0",
]
charts = [
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
]
all = [
    "deep-research-tool[selenium,pdf,charts,dev]",
]

[project.scripts]
deep-research = "deep_research_tool.cli:main"
info-gather = "info_gathering_agent.cli:main"
patent-research = "patent_research.cli:main"

[project.urls]
Homepage = "https://github.com/your-repo/deep-research-tool"
Documentation = "https://github.com/your-repo/deep-research-tool#readme"
Repository = "https://github.com/your-repo/deep-research-tool"

[tool.setuptools.packages.find]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
"deep_research_tool.webui" = ["static/*.html"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
