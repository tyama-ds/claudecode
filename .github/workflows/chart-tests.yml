# Deep Research Tool のチャート（chartkit）とレポートへの図の挿入のテスト。
#  日本語フォント（Noto CJK）を入れた環境で、両スタイル（classic / enhanced）の
#  描画 QA（重なり・はみ出し・負の値）と PDF / HTML への図の挿入を確認する。
#  有料 API は呼ばない（偽の LLM クライアントだけを使う）。
name: chart tests

on:
  push:
    paths:
      - "deep_research_tool/**"
      - ".github/workflows/chart-tests.yml"
  pull_request:
    paths:
      - "deep_research_tool/**"
      - ".github/workflows/chart-tests.yml"

jobs:
  charts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib reportlab pypdf python-docx Pillow beautifulsoup4 lxml \
            requests pydantic pytest
      - name: Chart tests
        run: |
          python -m pytest -q \
            deep_research_tool/tests/test_chartkit.py \
            deep_research_tool/tests/test_chart_styles.py
